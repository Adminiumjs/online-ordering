# SPDX-License-Identifier: AGPL-3.0-only
#
# Online Ordering's own checks — beside `ci.yml`, which is the fleet's synced
# workflow (build, the suite, the manifest) and is never hand-edited.
#
#   the contract   `src/contract/`: this repo's manifest and sample installed on
#                  a BUILT Adminium on SQLite, Postgres 16 and MySQL 8.4 — every
#                  table, every rule kept, both browser keys, the outbox; an
#                  install of 0.1.3 refused as an update. It skips without the
#                  checkout; here `ADMINIUM_REQUIRE_CONTRACT=1` makes a skip a
#                  failure, so it cannot go quietly green.
#   the browser    the website's demo build, every screen swept by axe.
#   the builds     both hosted sides and the website's demo (`demo.json`).
#
# The product checkout is moved out of the workspace before the suite runs:
# vitest collects every `*.test.ts` under the repo root, and the product's own
# suites are not this repo's to run.

name: contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    name: three-engine contract & the demo in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check out Adminium
        uses: actions/checkout@v4
        with:
          repository: MoSofi/Adminium
          path: .adminium-product

      # The e2e boot script serves the built server and the built dashboard, on
      # the engine it is asked for — the same composition `adminium start` runs.
      - name: Build Adminium (the server, the dashboard, the e2e boot)
        run: |
          cd .adminium-product
          corepack enable
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter="@adminium/e2e..."

      - name: Move the checkout out of the workspace
        run: mv "$GITHUB_WORKSPACE/.adminium-product" "$RUNNER_TEMP/adminium-product"

      - name: Types
        run: npx tsc -b

      - name: The suite, with the contract on three engines
        env:
          ADMINIUM_REPO: ${{ runner.temp }}/adminium-product
          ADMINIUM_REQUIRE_CONTRACT: "1"
          ADMINIUM_REQUIRE_VALIDATOR: "true"
          TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          TEST_MYSQL_URL: mysql://root@127.0.0.1:3306
        run: npx vitest run

      - name: The demo in a browser
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Both hosted sides, and the website's demo
        run: |
          npm run build:surface
          npm run build:demo
          test -f dist/demo.json
