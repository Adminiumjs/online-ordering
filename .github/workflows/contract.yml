# SPDX-License-Identifier: AGPL-3.0-only
#
# Online Ordering's own checks — beside `ci.yml`, which is the fleet's synced
# workflow (build, the suite, the manifest) and is never hand-edited.
#
#   the contract   `src/contract/`: this repo's manifest and sample installed on
#                  a BUILT Adminium on SQLite, Postgres 16 and MySQL 8.4 — every
#                  table, every rule kept, both browser keys, the outbox; an
#                  install of 0.1.3 refused as an update. It skips without the
#                  checkout; here `ADMINIUM_REQUIRE_CONTRACT=1` makes a skip a
#                  failure, so it cannot go quietly green.
#   the browser    the website's demo build, every screen swept by axe.
#   the builds     both hosted sides and the website's demo (`demo.json`).
#
# The contract runs as one job per database (`CONTRACT_ENGINES` picks the leg,
# and only that leg's URL is set), so no one job carries all three: on one
# runner the set no longer fit its time. SQLite's job also runs the rest of
# the suite (the manifest, the validator held to the product's, the units);
# the browser and the builds are a job of their own. Each timeout is about
# one and a half times what the job took on a developer's machine, plus the
# runner's builds of Adminium and the add-ons.
#
# Both checkouts are moved out of the workspace before the suite runs:
# vitest collects every `*.test.ts` under the repo root, and the product's own
# suites are not this repo's to run.

name: contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The Adminium release this version asks for, the add-ons release it was built against, and the release it updates.
  ADMINIUM_REF: v0.3.62
  ADD_ONS_REF: v1.0.10
  FROM_VERSION: 0.3.0
  FROM_REF: v0.3.20

jobs:
  contract:
    name: contract on ${{ matrix.engine }}
    runs-on: ubuntu-latest
    # Measured on a developer's machine: about 30 minutes of contract per database (SQLite's leg adds the
    # rest of the suite, about 3); the runner builds Adminium twice and the add-ons first (about 6).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: sqlite
            postgres: ""
            mysql: ""
            files: ""
          - engine: postgres
            postgres: postgres://postgres:postgres@127.0.0.1:5432/postgres
            mysql: ""
            files: src/contract/
          - engine: mysql
            postgres: ""
            mysql: mysql://root@127.0.0.1:3306
            files: src/contract/

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pinned to the releases the manifest names, so the contract proves what
      # an operator installs.
      - name: Check out Adminium
        uses: actions/checkout@v4
        with:
          repository: MoSofi/Adminium
          ref: ${{ env.ADMINIUM_REF }}
          path: .adminium-product

      # The update contract starts from the released version on the Adminium
      # it was released for: a second build.
      - name: Check out the Adminium the released version was made for
        uses: actions/checkout@v4
        with:
          repository: MoSofi/Adminium
          ref: ${{ env.FROM_REF }}
          path: .adminium-from

      - name: Check out the add-ons
        uses: actions/checkout@v4
        with:
          repository: Adminiumjs/add-ons
          ref: ${{ env.ADD_ONS_REF }}
          path: .add-ons

      # The e2e boot script serves the built server and the built dashboard, on
      # the engine it is asked for — the same composition `adminium start` runs.
      - name: Build Adminium (the server, the dashboard, the e2e boot)
        run: |
          cd .adminium-product
          corepack enable
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter="@adminium/e2e..."

      - name: Build the Adminium the released version was made for
        run: |
          cd .adminium-from
          corepack enable
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter="@adminium/e2e..."

      - name: Fetch the released package this version updates
        run: curl -fsSL "https://downloads.adminium.dev/apps/ordering/ordering-${FROM_VERSION}.tgz" -o "$RUNNER_TEMP/ordering-${FROM_VERSION}.tgz"

      - name: Build the add-ons
        run: |
          cd .add-ons
          npm ci
          npm run build

      - name: Move the checkouts out of the workspace
        run: |
          mv "$GITHUB_WORKSPACE/.adminium-product" "$RUNNER_TEMP/adminium-product"
          mv "$GITHUB_WORKSPACE/.adminium-from" "$RUNNER_TEMP/adminium-from"
          mv "$GITHUB_WORKSPACE/.add-ons" "$RUNNER_TEMP/add-ons"

      - name: The contract on ${{ matrix.engine }}${{ matrix.files == '' && ', and the rest of the suite' || '' }}
        env:
          ADMINIUM_REPO: ${{ runner.temp }}/adminium-product
          ADD_ONS_REPO: ${{ runner.temp }}/add-ons
          ADMINIUM_REQUIRE_CONTRACT: "1"
          ADMINIUM_REQUIRE_VALIDATOR: "true"
          CONTRACT_FROM_ADMINIUM: ${{ runner.temp }}/adminium-from
          CONTRACT_FROM_TARBALL: ${{ runner.temp }}/ordering-${{ env.FROM_VERSION }}.tgz
          # Only this job's database: the others' legs are left out, not skipped quietly.
          CONTRACT_ENGINES: ${{ matrix.engine }}
          TEST_POSTGRES_URL: ${{ matrix.postgres }}
          TEST_MYSQL_URL: ${{ matrix.mysql }}
        # One file at a time: each boots a server.
        run: npx vitest run --no-file-parallelism ${{ matrix.files }}

  browser:
    name: the demo in a browser, and the builds
    runs-on: ubuntu-latest
    # Measured on a developer's machine: the browser pass about 9 minutes, the types and builds about 3.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Types
        run: npx tsc -b

      - name: The demo in a browser
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Both hosted sides, and the website's demo
        run: |
          npm run build:surface
          npm run build:demo
          test -f dist/demo.json
